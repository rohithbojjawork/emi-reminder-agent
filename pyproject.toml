[project]
name = "emi-voice-agent"
version = "0.2.0"
description = "EMI reminder voice agent (Pipecat, Azure speech, browser WebRTC)"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[webrtc,azure,openai,runner]==1.14.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
